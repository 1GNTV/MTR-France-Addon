name: MTR France Forge 1.20.1 performance build
on:
  push:
    branches: [ "perf/forge-1201" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forge-1201:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Forge 1.20.1
        working-directory: legacy-forge
        run: |
          chmod +x gradlew
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          ./gradlew build -Pminecraft_version=1.20.1 --stacktrace
      - name: Verify mixin remapping in built JAR
        working-directory: legacy-forge
        run: |
          python3 - <<'PY'
          import glob, json, zipfile, sys
          jars = [p for p in glob.glob("build/libs/*.jar") if not any(t in p for t in ("-sources.jar", "-javadoc.jar"))]
          if not jars:
              sys.exit("No distributable Forge JAR found")
          for jar in jars:
              with zipfile.ZipFile(jar) as z:
                  config = json.loads(z.read("mtrfranceaddon.mixins.json"))
                  refmap_name = config.get("refmap")
                  if refmap_name != "mtrfranceaddon.refmap.json" or refmap_name not in z.namelist():
                      sys.exit(f"{jar}: Mixin refmap is missing or not declared")
                  remap = json.loads(z.read(refmap_name))
                  # MixinGradle may emit only loader-specific sections under "data".
                  sections = [remap.get("mappings", {})] + list(remap.get("data", {}).values())
                  target = "fr/mtrfra/mod/mixin/tab/CreativeModeTabMixin"
                  creative_entries = [section.get(target, {}) for section in sections]
                  print("Refmap sections:", [(name, list(section.keys())[:10]) for name, section in
                        [("default", remap.get("mappings", {})), *list(remap.get("data", {}).items())]])
                  matches = [entry for entry in creative_entries if any("buildContents" in key for key in entry)]
                  if not matches:
                      sys.exit(f"{jar}: no mapped CreativeModeTab.buildContents injector target; entries={creative_entries}")
                  print(f"Verified: {jar}, creative-target={matches}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MTR-France-optimized-forge-1.20.1
          path: |
            legacy-forge/build/libs/*.jar
            !legacy-forge/build/libs/*-sources.jar
          if-no-files-found: error
