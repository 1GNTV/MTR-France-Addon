name: MTR France Forge 1.20.1 performance build
on:
  push:
    branches: [ "perf/forge-1201" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forge-1201:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Forge 1.20.1
        working-directory: legacy-forge
        run: |
          chmod +x gradlew
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          ./gradlew build -Pminecraft_version=1.20.1 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MTR-France-optimized-forge-1.20.1
          path: |
            legacy-forge/build/libs/*.jar
            !legacy-forge/build/libs/*-sources.jar
          if-no-files-found: error
